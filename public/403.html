<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 — Доступ ограничен</title>
    <style>
        :root {
            --bg: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #ef4444;
            --success: #22c55e;
            --card-bg: rgba(30, 41, 59, 0.5);
            --border: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(15, 23, 42, 0.6);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f8fafc;
                --text-main: #0f172a;
                --text-muted: #64748b;
                --accent: #dc2626;
                --success: #16a34a;
                --card-bg: rgba(255, 255, 255, 0.7);
                --border: rgba(0, 0, 0, 0.06);
                --input-bg: rgba(255, 255, 255, 0.9);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 440px;
            width: 100%;
            text-align: center;
            background: var(--card-bg);
            padding: 2.5rem 2rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.07);
        }

        .code {
            font-size: 0.875rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 1rem;
            display: inline-block;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 0.75rem;
            letter-spacing: -0.02em;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .form-group {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        input[type="password"] {
            flex: 1;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            color: var(--text-main);
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input[type="password"]:focus {
            border-color: var(--text-muted);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.25rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--bg);
            background-color: var(--text-main);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.1s ease;
            white-space: nowrap;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .error-msg {
            color: var(--accent);
            font-size: 0.85rem;
            margin-top: 0.75rem;
            display: none;
        }
    </style>
</head>
<body>

    <main class="container">
        <span class="code">Ошибка 403</span>
        <h1>Доступ ограничен</h1>
        <p>Ресурс защищен. Если у вас есть ключ доступа, введите его ниже:</p>
        
        <div class="form-group">
            <input type="password" id="accessKey" placeholder="Введите ключ..." autocomplete="off">
            <button class="btn" id="submitBtn">Войти</button>
        </div>
        <div class="error-msg" id="errorMsg">Неверный ключ, попробуйте еще раз.</div>
    </main>

    <script>
        document.getElementById('submitBtn').addEventListener('click', function() {
            const val = document.getElementById('accessKey').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            document.cookie = `access_granted=${document.querySelector("input").value}; path=/; max-age=31536000; SameSite=Lax`;
            errorMsg.style.display = 'none';
            window.location.href = '/';
        });

        if(document.cookie.includes('access_granted=')) {
            errorMsg.style.display = 'block';
            document.getElementById('accessKey').value = '';
        }

        // Поддержка нажатия Enter в поле ввода
        document.getElementById('accessKey').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('submitBtn').click();
            }
        });
    </script>

</body>
</html>
