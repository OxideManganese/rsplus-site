<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 — Доступ ограничен</title>
    <style>
        :root {
            --bg: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #ef4444;
            --card-bg: rgba(30, 41, 59, 0.5);
            --border: rgba(255, 255, 255, 0.08);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f8fafc;
                --text-main: #0f172a;
                --text-muted: #64748b;
                --accent: #dc2626;
                --card-bg: rgba(255, 255, 255, 0.7);
                --border: rgba(0, 0, 0, 0.06);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 440px;
            width: 100%;
            text-align: center;
            background: var(--card-bg);
            padding: 2.5rem 2rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.07);
        }

        .code {
            font-size: 0.875rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 1rem;
            display: inline-block;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 0.75rem;
            letter-spacing: -0.02em;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--bg);
            background-color: var(--text-main);
            border-radius: 10px;
            text-decoration: none;
            transition: opacity 0.2s ease, transform 0.1s ease;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <main class="container">
        <span class="code">Ошибка 403</span>
        <h1>Доступ ограничен</h1>
        <p>В настоящий момент ресурс недоступен в вашей сети или IP-адресе.</p>
    </main>

</body>
</html>
